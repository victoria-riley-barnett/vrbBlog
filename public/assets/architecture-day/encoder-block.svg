<svg viewBox="0 0 1280 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="encoder-block-title encoder-block-desc">
        <title id="encoder-block-title">One encoder block</title>
        <desc id="encoder-block-desc">One encoder block read left to right: a layer-norm capsule, the multi-head attention layer, an addition, a second layer-norm capsule, the feed-forward layer and a second addition, with the residual path carrying x around each layer and the shape B×T×512 unchanged end to end. Four card edges behind the block fade out and the label reads L = 6. The key gives the model constants, four equations, a symbol glossary, and the equivalent torch.nn.TransformerEncoderLayer call with norm_first=True.</desc>
        <defs>
          <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ══ DEPTH: the block is one card of a deck. The deck suggests, the
             label counts — L = 6 with four cards, the rearmost at 0.20 meaning
             "continues". Cards are told apart by opaque FILL, not line weight:
             hairline opacity is the first thing a classroom projector loses. -->
        <rect x="168" y="16" width="992" height="272" rx="10" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="1.2"/>
        <rect x="152" y="32" width="992" height="272" rx="10" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)" stroke-width="1.2"/>
        <rect x="136" y="48" width="992" height="272" rx="10" fill="#f0f0f3" stroke="rgba(45,49,66,0.55)" stroke-width="1.2"/>
        <rect x="120" y="64" width="992" height="272" rx="10" fill="#eaeaee" stroke="rgba(45,49,66,0.70)" stroke-width="1.6"/>
        <text x="142" y="90" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">L = 6</text>

        <!-- ══ RESIDUAL PATH (drawn before nodes) ══════════════════════════ -->
        <path d="M 132,144 V 240 Q 132,248 140,248 H 552 Q 560,248 560,240 V 164"
              fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <path d="M 652,144 V 296 Q 652,304 660,304 H 1060 Q 1068,304 1068,296 V 164"
              fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <circle cx="132" cy="144" r="4" fill="#bf4520"/>
        <circle cx="652" cy="144" r="4" fill="#bf4520"/>

        <!-- ══ STREAM ══════════════════════════════════════════════════════ -->
        <line x1="72"   y1="144" x2="152"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="200"  y1="144" x2="272"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="488"  y1="144" x2="540"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="580"  y1="144" x2="672"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="720"  y1="144" x2="792"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="976"  y1="144" x2="1048" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="1088" y1="144" x2="1200" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/>

        <!-- ══ APPLIED TO THE STREAM: filled capsules, not boxes ═══════════ -->
        <rect x="152" y="126" width="48" height="36" rx="18" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="176" y="149" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LN</text>

        <rect x="672" y="126" width="48" height="36" rx="18" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="696" y="149" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LN</text>

        <!-- ══ SUMS TWO STREAMS ════════════════════════════════════════════ -->
        <circle cx="560" cy="144" r="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <path d="M 549,144 H 571 M 560,133 V 155" fill="none" stroke="#2d3142" stroke-width="1.8"/>
        <circle cx="1068" cy="144" r="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <path d="M 1057,144 H 1079 M 1068,133 V 155" fill="none" stroke="#2d3142" stroke-width="1.8"/>

        <!-- ══ LEARNED TRANSFORMATION: white rectangle, heavy border ═══════ -->
        <rect x="272" y="100" width="216" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="100" width="216" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <text x="380" y="140" fill="#2d3142" font-size="16" font-weight="600"
              font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Multi-Head Attention</text>
        <text x="380" y="168" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">softmax(QKᵀ/√64)·V</text>

        <rect x="792" y="100" width="184" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="100" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <text x="884" y="140" fill="#2d3142" font-size="16" font-weight="600"
              font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Feed Forward</text>
        <text x="884" y="168" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ReLU(xW₁+b₁)W₂+b₂</text>

        <!-- ══ STREAM NAMES AND SHAPES ═════════════════════════════════════ -->
        <text x="96" y="130" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x</text>
        <text x="112" y="166" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">B×T×512</text>
        <text x="1160" y="130" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x₂</text>
        <text x="1152" y="166" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">B×T×512</text>

        <rect x="363" y="228" width="16" height="16" rx="2" fill="#eaeaee"/>
        <text x="371" y="240" fill="#bf4520" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x</text>
        <rect x="844" y="284" width="16" height="16" rx="2" fill="#eaeaee"/>
        <text x="852" y="296" fill="#bf4520" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x₁</text>

        <!-- ══ KEY: constants, equations, reference call ═══════════════════ -->
        <line x1="120" y1="384" x2="1160" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <text x="120" y="408" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">MODEL</text>
        <text x="208" y="408" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">d = 512 features · h = 8 heads · d/h = 64 · B = batch · T = positions</text>

        <line x1="120" y1="432" x2="1160" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

        <text x="120" y="456" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">TERM</text>
        <text x="200" y="456" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EQUATION</text>

        <text x="120" y="482" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">LN</text>
        <text x="200" y="482" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">LN(x) = (x − μ)/σ · γ + β</text>

        <text x="120" y="508" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">MHA</text>
        <text x="200" y="508" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">MHA(x) = softmax(QKᵀ/√64)·V</text>

        <text x="120" y="534" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">FFN</text>
        <text x="200" y="534" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">FFN(x) = ReLU(xW₁+b₁)W₂+b₂</text>

        <circle cx="128" cy="556" r="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <path d="M 124,556 H 132 M 128,552 V 560" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <text x="200" y="560" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">x + F(LN(x))</text>

        <!-- ══ REFERENCE: the library call, kept apart from the key ════════ -->
        <line x1="780" y1="444" x2="780" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <text x="812" y="456" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PYTORCH</text>

        <text x="812" y="482" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">nn.TransformerEncoderLayer(</text>
        <text x="812" y="498" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    d_model=512,            # d</text>
        <text x="812" y="514" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nhead=8,                # h</text>
        <text x="812" y="530" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    dim_feedforward=2048,   # 4d</text>
        <text x="812" y="546" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    activation=nn.ReLU(),   # max(0, z)</text>
        <text x="812" y="562" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    norm_first=True)        # LN inside</text>
        <!-- ══ SYMBOLS ═════════════════════════════════════════════════════ -->
        <line x1="120" y1="588" x2="1160" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="120" y="612" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SYMBOLS</text>

        <text x="120" y="638" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">μ, σ</text>
        <text x="190" y="638" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">mean, std of one row's d features</text>
        <text x="470" y="638" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">ReLU</text>
        <text x="540" y="638" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">max(0, z)</text>
        <text x="820" y="638" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">F</text>
        <text x="890" y="638" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">sublayer inside the branch</text>

        <text x="120" y="662" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">γ, β</text>
        <text x="190" y="662" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">learned scale and shift, length d</text>
        <text x="470" y="662" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">W₁, W₂</text>
        <text x="540" y="662" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">d × 4d, 4d × d</text>
        <circle cx="826" cy="658" r="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <path d="M 822,658 H 830 M 826,654 V 662" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <text x="890" y="662" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">elementwise addition</text>

        <text x="120" y="686" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Q, K, V</text>
        <text x="190" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">xW_Q, xW_K, xW_V</text>
        <text x="470" y="686" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">b₁, b₂</text>
        <text x="540" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">bias vectors</text>
        <text x="820" y="686" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">x, x₁, x₂</text>
        <text x="890" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">stream before, between, after</text>

        <text x="120" y="710" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">softmax</text>
        <text x="190" y="710" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">over j; each row sums to 1</text>
        <text x="470" y="710" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">√(d/h)</text>
        <text x="540" y="710" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">= √64 = 8</text>
      </svg>
