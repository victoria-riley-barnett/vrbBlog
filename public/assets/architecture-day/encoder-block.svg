<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="encoder-block-title encoder-block-desc" role="img" viewBox="0 0 1280 744"><title id="encoder-block-title">One encoder block</title><desc id="encoder-block-desc">One encoder block read left to right: a layer-norm capsule, the multi-head attention layer, an addition, a second layer-norm capsule, the feed-forward layer and a second addition, with the residual path carrying x around each layer and the shape B×T×512 unchanged end to end. Four card edges behind the block fade out and the label reads L = 6. The key gives the model constants, four equations, a symbol glossary, and the equivalent torch.nn.TransformerEncoderLayer call with norm_first=True.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#4f5d75" points="0 0 9 4 0 8"/></marker><marker id="arrow-accent" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#bf4520" points="0 0 9 4 0 8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect width="992" height="272" x="168" y="16" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="1.2" rx="10"/><rect width="992" height="272" x="152" y="32" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)" stroke-width="1.2" rx="10"/><rect width="992" height="272" x="136" y="48" fill="#f0f0f3" stroke="rgba(45,49,66,0.55)" stroke-width="1.2" rx="10"/><rect width="992" height="272" x="120" y="64" fill="#eaeaee" stroke="rgba(45,49,66,0.70)" stroke-width="1.6" rx="10"/><text x="142" y="90" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">L = 6</text><path fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)" d="M 132,144 V 240 Q 132,248 140,248 H 552 Q 560,248 560,240 V 164"/><path fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)" d="M 652,144 V 296 Q 652,304 660,304 H 1060 Q 1068,304 1068,296 V 164"/><circle cx="132" cy="144" r="4" fill="#bf4520"/><circle cx="652" cy="144" r="4" fill="#bf4520"/><line x1="72" x2="152" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="200" x2="272" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="488" x2="540" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="580" x2="672" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="720" x2="792" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="976" x2="1048" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1088" x2="1200" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><rect width="48" height="36" x="152" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="176" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">LN</text><rect width="48" height="36" x="672" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="696" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">LN</text><circle cx="560" cy="144" r="20" fill="#fff" stroke="#2d3142" stroke-width="1.8"/><path fill="none" stroke="#2d3142" stroke-width="1.8" d="M 549,144 H 571 M 560,133 V 155"/><circle cx="1068" cy="144" r="20" fill="#fff" stroke="#2d3142" stroke-width="1.8"/><path fill="none" stroke="#2d3142" stroke-width="1.8" d="M 1057,144 H 1079 M 1068,133 V 155"/><rect width="216" height="88" x="272" y="100" fill="#f5f5f5" rx="6"/><rect width="216" height="88" x="272" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="380" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Multi-Head Attention</text><text x="380" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">softmax(QKᵀ/√64)·V</text><rect width="184" height="88" x="792" y="100" fill="#f5f5f5" rx="6"/><rect width="184" height="88" x="792" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="884" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Feed Forward</text><text x="884" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">ReLU(xW₁+b₁)W₂+b₂</text><text x="96" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x</text><text x="112" y="166" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="end">B×T×512</text><text x="1160" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x₂</text><text x="1152" y="166" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">B×T×512</text><rect width="16" height="16" x="363" y="228" fill="#eaeaee" rx="2"/><text x="371" y="240" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x</text><rect width="16" height="16" x="844" y="284" fill="#eaeaee" rx="2"/><text x="852" y="296" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x₁</text><line x1="120" x2="1160" y1="384" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="408" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">MODEL</text><text x="208" y="408" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">d = 512 features · h = 8 heads · d/h = 64 · B = batch · T = positions</text><line x1="120" x2="1160" y1="432" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">TERM</text><text x="200" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">EQUATION</text><text x="120" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">LN</text><text x="200" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">LN(x) = (x − μ)/σ · γ + β</text><text x="120" y="508" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">MHA</text><text x="200" y="508" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">MHA(x) = softmax(QKᵀ/√64)·V</text><text x="120" y="534" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">FFN</text><text x="200" y="534" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">FFN(x) = ReLU(xW₁+b₁)W₂+b₂</text><circle cx="128" cy="556" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><path fill="none" stroke="#2d3142" stroke-width="1.2" d="M 124,556 H 132 M 128,552 V 560"/><text x="200" y="560" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">x + F(LN(x))</text><line x1="780" x2="780" y1="444" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="812" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">PYTORCH</text><text x="812" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.TransformerEncoderLayer(</text><text x="812" y="498" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">d_model=512, # d</text><text x="812" y="514" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nhead=8, # h</text><text x="812" y="530" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">dim_feedforward=2048, # 4d</text><text x="812" y="546" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">activation=nn.ReLU(), # max(0, z)</text><text x="812" y="562" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">norm_first=True) # LN inside</text><line x1="120" x2="1160" y1="588" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="612" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">SYMBOLS</text><text x="120" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">μ, σ</text><text x="190" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">mean, std of one row&apos;s d features</text><text x="470" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">ReLU</text><text x="540" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">max(0, z)</text><text x="820" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">F</text><text x="890" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">sublayer inside the branch</text><text x="120" y="662" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">γ, β</text><text x="190" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">learned scale and shift, length d</text><text x="470" y="662" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">W₁, W₂</text><text x="540" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">d × 4d, 4d × d</text><circle cx="826" cy="658" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><path fill="none" stroke="#2d3142" stroke-width="1.2" d="M 822,658 H 830 M 826,654 V 662"/><text x="890" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">elementwise addition</text><text x="120" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">Q, K, V</text><text x="190" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">xW_Q, xW_K, xW_V</text><text x="470" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">b₁, b₂</text><text x="540" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">bias vectors</text><text x="820" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">x, x₁, x₂</text><text x="890" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">stream before, between, after</text><text x="120" y="710" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">softmax</text><text x="190" y="710" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">over j; each row sums to 1</text><text x="470" y="710" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">√(d/h)</text><text x="540" y="710" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">= √64 = 8</text></svg>