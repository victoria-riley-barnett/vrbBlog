<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feedforward-title feedforward-desc">
        <title id="feedforward-title">A feed-forward network</title>
        <desc id="feedforward-desc">A feed-forward network read left to right: the input x of shape B × 512 enters a Linear layer whose weight matrix is 512 × 256, then a ReLU capsule, a second Linear of 256 × 256, a second ReLU capsule, and a third Linear of 256 × 10, whose output is y-hat of shape B × 10 after a softmax over the ten scores. White rectangles own weight matrices, gray capsules own none. The key gives the model constants, three equations in flow order, a symbol glossary, and the equivalent nn.Sequential call with each line mapped onto the drawing.</desc>
        <defs>
          <marker id="feedforward-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ══ STREAM: one flat vector of d features per example ═══════════ -->
        <line x1="72"   y1="144" x2="144"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>
        <line x1="312"  y1="144" x2="356"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>
        <line x1="440"  y1="144" x2="484"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>
        <line x1="652"  y1="144" x2="696"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>
        <line x1="780"  y1="144" x2="824"  y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>
        <line x1="992"  y1="144" x2="1152" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/>

        <!-- ══ APPLIED TO THE STREAM: capsule, owns no weights ════════════ -->
        <rect x="356" y="126" width="84" height="36" rx="18" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="398" y="149" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ReLU</text>

        <rect x="696" y="126" width="84" height="36" rx="18" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="738" y="149" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ReLU</text>

        <!-- ══ LEARNED TRANSFORMATION: white rectangle, owns W and b ══════ -->
        <rect x="144" y="100" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="144" y="100" width="168" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <text x="228" y="140" fill="#2d3142" font-size="16" font-weight="600"
              font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Linear</text>
        <text x="228" y="168" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">512 × 256</text>

        <rect x="484" y="100" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="100" width="168" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <text x="568" y="140" fill="#2d3142" font-size="16" font-weight="600"
              font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Linear</text>
        <text x="568" y="168" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">256 × 256</text>

        <rect x="824" y="100" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="824" y="100" width="168" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/>
        <text x="908" y="140" fill="#2d3142" font-size="16" font-weight="600"
              font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Linear</text>
        <text x="908" y="168" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">256 × 10</text>

        <!-- ══ STREAM NAMES AND SHAPES ═════════════════════════════════════ -->
        <text x="100" y="130" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x</text>
        <text x="116" y="166" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">B × 512</text>

        <text x="1072" y="130" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ŷ = softmax(z<tspan dy="3" font-size="9">L</tspan><tspan dy="-3">)</tspan></text>
        <text x="1072" y="166" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">B × 10</text>

        <!-- ══ KEY: constants, equations, reference call ═══════════════════ -->
        <line x1="120" y1="300" x2="1160" y2="300" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <text x="120" y="324" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">MODEL</text>
        <text x="208" y="324" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">d = 512 features · h = 256 hidden · K = 10 classes · B = batch</text>

        <line x1="120" y1="348" x2="1160" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

        <text x="120" y="372" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">TERM</text>
        <text x="200" y="372" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EQUATION</text>

        <text x="120" y="398" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Linear</text>
        <text x="200" y="398" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">z = xW + b</text>

        <text x="120" y="424" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">ReLU</text>
        <text x="200" y="424" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">h = max(0, z)</text>

        <text x="120" y="450" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Output</text>
        <text x="200" y="450" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">ŷ = softmax(z<tspan dy="3" font-size="9">L</tspan><tspan dy="-3">)</tspan></text>

        <!-- ══ REFERENCE: the library call, kept apart from the key ════════ -->
        <line x1="780" y1="360" x2="780" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <text x="812" y="372" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PYTORCH</text>

        <text x="812" y="398" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">nn.Sequential(</text>
        <text x="812" y="413" xml:space="preserve" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nn.Linear(512, 256),</text>
        <text x="812" y="428" xml:space="preserve" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nn.ReLU(),</text>
        <text x="812" y="443" xml:space="preserve" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nn.Linear(256, 256),</text>
        <text x="812" y="458" xml:space="preserve" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nn.ReLU(),</text>
        <text x="812" y="473" xml:space="preserve" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">    nn.Linear(256, 10))</text>
        <text x="812" y="488" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">ŷ = softmax(z<tspan dy="2.5" font-size="7.5">L</tspan><tspan dy="-2.5">)</tspan></text>

        <text x="976" y="398" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># the chain, left to right</text>
        <text x="976" y="413" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># Linear · 512 × 256</text>
        <text x="976" y="428" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># ReLU capsule</text>
        <text x="976" y="443" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># Linear · 256 × 256</text>
        <text x="976" y="458" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># ReLU capsule</text>
        <text x="976" y="473" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># Linear · 256 × 10</text>
        <text x="976" y="488" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace"># output, not a layer</text>

        <!-- ══ SYMBOLS ═════════════════════════════════════════════════════ -->
        <line x1="120" y1="504" x2="1160" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="120" y="528" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SYMBOLS</text>

        <text x="120" y="554" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">x</text>
        <text x="190" y="554" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">input features, B × d, unordered</text>
        <text x="470" y="554" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">W</text>
        <text x="540" y="554" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">weights of one Linear</text>
        <text x="820" y="554" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">b</text>
        <text x="890" y="554" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">bias, one per output</text>

        <text x="120" y="578" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">z</text>
        <text x="190" y="578" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">pre-activation, xW + b</text>
        <text x="470" y="578" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">ReLU</text>
        <text x="540" y="578" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">max(0, z), elementwise</text>
        <text x="820" y="578" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">h</text>
        <text x="890" y="578" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">hidden width, 256</text>

        <text x="120" y="602" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">softmax</text>
        <text x="190" y="602" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">over K scores; each row sums to 1</text>
        <text x="470" y="602" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">ŷ</text>
        <text x="540" y="602" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">class probabilities, B × K</text>
        <text x="820" y="602" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">z<tspan dy="3" font-size="8">L</tspan></text>
        <text x="890" y="602" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">pre-activation of the last Linear</text>

        <text x="120" y="626" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">B</text>
        <text x="190" y="626" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">examples per batch</text>
        <text x="470" y="626" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">d</text>
        <text x="540" y="626" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">input features, 512</text>
        <text x="820" y="626" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">K</text>
        <text x="890" y="626" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">classes, 10</text>
      </svg>
