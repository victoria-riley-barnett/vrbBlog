<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="feedforward-title feedforward-desc" role="img" viewBox="0 0 1280 660"><title id="feedforward-title">A feed-forward network</title><desc id="feedforward-desc">A feed-forward network read left to right: the input x of shape B × 512 enters a Linear layer whose weight matrix is 512 × 256, then a ReLU capsule, a second Linear of 256 × 256, a second ReLU capsule, and a third Linear of 256 × 10, whose output is y-hat of shape B × 10 after a softmax over the ten scores. White rectangles own weight matrices, gray capsules own none. The key gives the model constants, three equations in flow order, a symbol glossary, and the equivalent nn.Sequential call with each line mapped onto the drawing.</desc><defs><marker id="feedforward-arrow" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#4f5d75" points="0 0 9 4 0 8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="72" x2="144" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><line x1="312" x2="356" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><line x1="440" x2="484" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><line x1="652" x2="696" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><line x1="780" x2="824" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><line x1="992" x2="1152" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#feedforward-arrow)"/><rect width="84" height="36" x="356" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="398" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">ReLU</text><rect width="84" height="36" x="696" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="738" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">ReLU</text><rect width="168" height="88" x="144" y="100" fill="#f5f5f5" rx="6"/><rect width="168" height="88" x="144" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="228" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linear</text><text x="228" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">512 × 256</text><rect width="168" height="88" x="484" y="100" fill="#f5f5f5" rx="6"/><rect width="168" height="88" x="484" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="568" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linear</text><text x="568" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">256 × 256</text><rect width="168" height="88" x="824" y="100" fill="#f5f5f5" rx="6"/><rect width="168" height="88" x="824" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="908" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linear</text><text x="908" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">256 × 10</text><text x="100" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x</text><text x="116" y="166" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="end">B × 512</text><text x="1072" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">ŷ = softmax(z<tspan dy="3" font-size="9">L</tspan><tspan dy="-3">)</tspan></text><text x="1072" y="166" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">B × 10</text><line x1="120" x2="1160" y1="300" y2="300" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="324" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">MODEL</text><text x="208" y="324" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">d = 512 features · h = 256 hidden · K = 10 classes · B = batch</text><line x1="120" x2="1160" y1="348" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="372" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">TERM</text><text x="200" y="372" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">EQUATION</text><text x="120" y="398" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">Linear</text><text x="200" y="398" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">z = xW + b</text><text x="120" y="424" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">ReLU</text><text x="200" y="424" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">h = max(0, z)</text><text x="120" y="450" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">Output</text><text x="200" y="450" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">ŷ = softmax(z<tspan dy="3" font-size="9">L</tspan><tspan dy="-3">)</tspan></text><line x1="780" x2="780" y1="360" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="812" y="372" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">PYTORCH</text><text x="812" y="398" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.Sequential(</text><text x="812" y="413" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" xml:space="preserve">nn.Linear(512, 256),</text><text x="812" y="428" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" xml:space="preserve">nn.ReLU(),</text><text x="812" y="443" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" xml:space="preserve">nn.Linear(256, 256),</text><text x="812" y="458" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" xml:space="preserve">nn.ReLU(),</text><text x="812" y="473" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" xml:space="preserve">nn.Linear(256, 10))</text><text x="812" y="488" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">ŷ = softmax(z<tspan dy="2.5" font-size="7.5">L</tspan><tspan dy="-2.5">)</tspan></text><text x="976" y="398" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># the chain, left to right</text><text x="976" y="413" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># Linear · 512 × 256</text><text x="976" y="428" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># ReLU capsule</text><text x="976" y="443" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># Linear · 256 × 256</text><text x="976" y="458" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># ReLU capsule</text><text x="976" y="473" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># Linear · 256 × 10</text><text x="976" y="488" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># output, not a layer</text><line x1="120" x2="1160" y1="504" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="528" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">SYMBOLS</text><text x="120" y="554" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">x</text><text x="190" y="554" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">input features, B × d, unordered</text><text x="470" y="554" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">W</text><text x="540" y="554" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">weights of one Linear</text><text x="820" y="554" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">b</text><text x="890" y="554" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">bias, one per output</text><text x="120" y="578" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">z</text><text x="190" y="578" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">pre-activation, xW + b</text><text x="470" y="578" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">ReLU</text><text x="540" y="578" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">max(0, z), elementwise</text><text x="820" y="578" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">h</text><text x="890" y="578" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">hidden width, 256</text><text x="120" y="602" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">softmax</text><text x="190" y="602" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">over K scores; each row sums to 1</text><text x="470" y="602" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">ŷ</text><text x="540" y="602" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">class probabilities, B × K</text><text x="820" y="602" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">z<tspan dy="3" font-size="8">L</tspan></text><text x="890" y="602" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">pre-activation of the last Linear</text><text x="120" y="626" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">B</text><text x="190" y="626" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">examples per batch</text><text x="470" y="626" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">d</text><text x="540" y="626" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">input features, 512</text><text x="820" y="626" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">K</text><text x="890" y="626" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">classes, 10</text></svg>