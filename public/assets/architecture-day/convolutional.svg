<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="convolutional-title convolutional-desc" role="img" viewBox="0 0 1280 744"><title id="convolutional-title">A convolutional network</title><desc id="convolutional-desc">Two panels. On the left, an 8 by 8 single-channel input grid carries two accent-outlined 3 by 3 receptive fields at non-overlapping positions, joined by a faint slide connector; a 3 by 3 grid of filter values lies beside the grid, bracketed by dashes onto both fields, and one field yields one output cell, y[i,j]. On the right, the stack runs left to right: x enters Conv, ReLU, Pool, Conv, ReLU, Pool, Flatten and Linear and leaves as class scores, with the tensor shape under each stage: B by 32 by 8 by 8, B by 32 by 4 by 4, B by 64 by 4 by 4, B by 64 by 2 by 2, B by 256 and B by K. Rectangles own weights, capsules are applied to the stream. The key gives the model constants, four equations, a symbol glossary, and the equivalent torch.nn calls with the tensor shape each one produces.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#4f5d75" points="0 0 9 4 0 8"/></marker><marker id="arrow-accent" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#bf4520" points="0 0 9 4 0 8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect width="144" height="144" x="120" y="106" fill="#eaeaee"/><g stroke="rgba(45,49,66,0.45)" stroke-width="1"><line x1="138" x2="138" y1="106" y2="250"/><line x1="156" x2="156" y1="106" y2="250"/><line x1="174" x2="174" y1="106" y2="250"/><line x1="192" x2="192" y1="106" y2="250"/><line x1="210" x2="210" y1="106" y2="250"/><line x1="228" x2="228" y1="106" y2="250"/><line x1="246" x2="246" y1="106" y2="250"/><line x1="120" x2="264" y1="124" y2="124"/><line x1="120" x2="264" y1="142" y2="142"/><line x1="120" x2="264" y1="160" y2="160"/><line x1="120" x2="264" y1="178" y2="178"/><line x1="120" x2="264" y1="196" y2="196"/><line x1="120" x2="264" y1="214" y2="214"/><line x1="120" x2="264" y1="232" y2="232"/></g><rect width="144" height="144" x="120" y="106" fill="none" stroke="rgba(45,49,66,0.55)" stroke-width="1.4"/><line x1="237" x2="237" y1="162" y2="194" stroke="rgba(79,93,117,0.50)" stroke-dasharray="4 3" stroke-width="1.4"/><g opacity=".72"><path fill="none" stroke="#4f5d75" stroke-dasharray="4 3" stroke-width="1.4" d="M 268,133 H 274 Q 282,133 282,141 V 215 Q 282,223 274,223 H 268"/><path fill="none" stroke="#4f5d75" stroke-dasharray="4 3" stroke-width="1.4" d="M 296,178 H 282"/></g><line x1="354" x2="382" y1="178" y2="178" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><rect width="54" height="54" x="210" y="106" fill="none" stroke="#bf4520" stroke-width="2"/><rect width="54" height="54" x="210" y="196" fill="none" stroke="#bf4520" stroke-width="2"/><rect width="58" height="58" x="296" y="149" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="3"/><g stroke="rgba(45,49,66,0.25)" stroke-width="1"><line x1="315.33" x2="315.33" y1="149" y2="207"/><line x1="334.67" x2="334.67" y1="149" y2="207"/><line x1="296" x2="354" y1="168.33" y2="168.33"/><line x1="296" x2="354" y1="187.67" y2="187.67"/></g><g fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle"><text x="305.67" y="162.87">1</text><text x="325" y="162.87">0</text><text x="344.33" y="162.87">−1</text><text x="305.67" y="182.2">2</text><text x="325" y="182.2">0</text><text x="344.33" y="182.2">−2</text><text x="305.67" y="201.53">1</text><text x="325" y="201.53">0</text><text x="344.33" y="201.53">−1</text></g><rect width="30" height="30" x="382" y="163" fill="#eaeaee" stroke="rgba(45,49,66,0.60)" stroke-width="1.6"/><text x="120" y="88" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">x</text><text x="210" y="88" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">same w, every position</text><text x="120" y="272" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">B×1×8×8</text><text x="325" y="141" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">w</text><text x="397" y="152" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">y[i,j]</text><text x="397" y="214" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">one scalar</text><line x1="456" x2="483" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="551" x2="578" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="624" x2="651" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="697" x2="724" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="792" x2="819" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="865" x2="892" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="938" x2="965" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1033" x2="1060" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1128" x2="1155" y1="144" y2="144" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><rect width="46" height="36" x="578" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="601" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">ReLU</text><rect width="46" height="36" x="651" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="674" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">Pool</text><rect width="46" height="36" x="819" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="842" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">ReLU</text><rect width="46" height="36" x="892" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="915" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">Pool</text><rect width="68" height="36" x="965" y="126" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2" rx="18"/><text x="999" y="149" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="500" text-anchor="middle">Flatten</text><rect width="68" height="88" x="483" y="100" fill="#f5f5f5" rx="6"/><rect width="68" height="88" x="483" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="517" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Conv</text><text x="517" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">w·x + c</text><rect width="68" height="88" x="724" y="100" fill="#f5f5f5" rx="6"/><rect width="68" height="88" x="724" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="758" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Conv</text><text x="758" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">w·x + c</text><rect width="68" height="88" x="1060" y="100" fill="#f5f5f5" rx="6"/><rect width="68" height="88" x="1060" y="100" fill="#fff" stroke="#2d3142" stroke-width="1.8" rx="6"/><text x="1094" y="140" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linear</text><text x="1094" y="168" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">256×K</text><text x="469" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">x</text><text x="1141" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">ŷ</text><g fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle"><text x="517" y="214">B×32×8×8</text><text x="674" y="214">B×32×4×4</text><text x="758" y="214">B×64×4×4</text><text x="915" y="214">B×64×2×2</text><text x="999" y="214">B×256</text><text x="1094" y="214">B×K</text></g><line x1="120" x2="1160" y1="384" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="408" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">MODEL</text><text x="208" y="408" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">C = 1 channel · H = W = 8 · k = 3 kernel · K = 10 classes · B = batch</text><line x1="120" x2="1160" y1="432" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">TERM</text><text x="200" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">EQUATION</text><text x="120" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">Conv</text><text x="200" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">y[i,j] = Σ<tspan dy="3" font-size="9">a,b</tspan><tspan dy="-3"> w[a,b]·x[i+a, j+b] + c</tspan></text><text x="120" y="508" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">ReLU</text><text x="200" y="508" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">ReLU(z) = max(0, z)</text><text x="120" y="534" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">Pool</text><text x="200" y="534" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">max over a 2×2 window, stride 2</text><text x="120" y="560" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500">Flatten</text><text x="200" y="560" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">B×64×2×2 → B×256</text><line x1="780" x2="780" y1="444" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="812" y="456" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">PYTORCH</text><text x="812" y="482" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.Conv2d(1, 32, kernel_size=3, padding=1)</text><text x="812" y="498" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.MaxPool2d(2)</text><text x="812" y="514" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.Conv2d(32, 64, kernel_size=3, padding=1)</text><text x="812" y="530" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.MaxPool2d(2)</text><text x="812" y="546" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.Flatten()</text><text x="812" y="562" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">nn.Linear(256, 10)</text><text x="1082" y="482" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># k=3, pad 1</text><text x="1082" y="498" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># 4×4</text><text x="1082" y="514" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># 32→64</text><text x="1082" y="530" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># 2×2</text><text x="1082" y="546" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># 64·2·2=256</text><text x="1082" y="562" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10"># 256→K</text><line x1="120" x2="1160" y1="588" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="1"/><text x="120" y="612" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing=".14em">SYMBOLS</text><text x="120" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">x</text><text x="190" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">one input channel, H×W</text><text x="470" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">y</text><text x="540" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">one element of the conv output</text><text x="820" y="638" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">ŷ</text><text x="890" y="638" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">class scores, B×K</text><text x="120" y="662" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">w</text><text x="190" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">one k×k filter, reused at all positions</text><text x="470" y="662" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">i, j</text><text x="540" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">row, column of that element</text><text x="820" y="662" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">32, 64</text><text x="890" y="662" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">filters in each conv layer</text><text x="120" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">c</text><text x="190" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">bias, one per filter</text><text x="470" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">a, b</text><text x="540" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">row, column inside the k×k window</text><text x="820" y="686" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">256</text><text x="890" y="686" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">flattened length, 64·2·2</text><text x="120" y="710" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">z</text><text x="190" y="710" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">conv output before ReLU</text><text x="470" y="710" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">w·x</text><text x="540" y="710" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">dot product over one window</text><text x="820" y="710" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">2×2</text><text x="890" y="710" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="11">pool window, stride 2</text></svg>