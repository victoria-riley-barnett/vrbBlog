<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="eq-conv-window-title eq-conv-window-desc" role="img" viewBox="0 0 1280 630"><title id="eq-conv-window-title">One convolution position</title><desc id="eq-conv-window-desc">The rule y = sum over k of w-k x-k, its five symbols, and one position of a 3 by 3 filter worked on a 5 by 5 image. The window holds the values 1 to 9 and the filter is 1, 0, -1 on each of its three rows. Each row of the window gives one product line: 1 times 1 plus 0 times 2 plus -1 times 3 is 1 plus 0 minus 3, which is -2, and each of the next two rows gives -2 again, so y = -2 - 2 - 2 = -6. The same nine weights are reused when the window shifts one cell right; at the border the window runs off the image, so with no padding those positions have no y.</desc><defs><marker id="eq-conv-window-arrow" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><polygon fill="#4f5d75" points="0 0 9 4 0 8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="120" y="124" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="30"><tspan fill="#bf4520">y</tspan> = Σ<tspan dy="5.5" font-size="16">k</tspan><tspan dy="-5.5"> w</tspan><tspan dy="5.5" font-size="16">k</tspan><tspan dy="-5.5"> x</tspan><tspan dy="5.5" font-size="16">k</tspan></text><line x1="120" x2="1160" y1="144" y2="144" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="176" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">SYMBOL</text><text x="200" y="176" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">NAME</text><text x="380" y="176" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">WHAT IT IS</text><line x1="120" x2="1160" y1="190" y2="190" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="218" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="15">y</text><text x="200" y="218" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12">output</text><text x="380" y="218" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="12">number; the value written for this one window position</text><text x="120" y="244" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="15">Σ<tspan dy="3.5" font-size="10">k</tspan></text><text x="200" y="244" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12">sum</text><text x="380" y="244" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="12">operator; add the nine terms, one per cell of the window</text><text x="120" y="270" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="15">k</text><text x="200" y="270" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12">cell index</text><text x="380" y="270" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="12">index; 1 to 9, which cell of the window</text><text x="120" y="296" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="15">w<tspan dy="3.5" font-size="10">k</tspan></text><text x="200" y="296" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12">filter weight</text><text x="380" y="296" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="12">number; the filter weight at cell k, the same nine at every position</text><text x="120" y="322" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="15">x<tspan dy="3.5" font-size="10">k</tspan></text><text x="200" y="322" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12">pixel</text><text x="380" y="322" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="12">number; the image value at cell k inside this window</text><line x1="120" x2="1160" y1="344" y2="344" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="378" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">WORKED · IMAGE 5×5 · 1 CHANNEL · WINDOW 3×3 · FILTER 3×3 · STRIDE 1 · NO PADDING</text><text x="120" y="404" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">IMAGE</text><text x="248" y="404" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">PATCH</text><text x="340" y="404" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">FILTER</text><text x="440" y="404" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">NINE PRODUCTS, ONE ROW AT A TIME</text><line x1="120" x2="210" y1="416" y2="416" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="210" y1="434" y2="434" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="210" y1="452" y2="452" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="210" y1="470" y2="470" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="210" y1="488" y2="488" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="210" y1="506" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="120" x2="120" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="138" x2="138" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="156" x2="156" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="174" x2="174" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="192" x2="192" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><line x1="210" x2="210" y1="416" y2="506" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="129" y="428.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monos