ono', ui-monospace, monospace" font-size="10" text-anchor="middle">0</text><text x="147" y="482.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">7</text><text x="165" y="482.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">8</text><text x="183" y="482.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">9</text><text x="201" y="482.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">1</text><text x="129" y="500.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">1</text><text x="147" y="500.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">2</text><text x="165" y="500.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">1</text><text x="183" y="500.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">3</text><text x="201" y="500.5" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">0</text><rect width="54" height="54" x="156" y="434" fill="none" stroke="#bf4520" stroke-dasharray="5 4" stroke-width="1.6"/><rect width="54" height="54" x="138" y="434" fill="none" stroke="#bf4520" stroke-width="2"/><text x="120" y="522" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing=".14em">dashed = the next position, +1 cell</text><line x1="216" x2="242" y1="461" y2="461" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#eq-conv-window-arrow)"/><line x1="308" x2="334" y1="461" y2="461" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#eq-conv-window-arrow)"/><line x1="400" x2="432" y1="461" y2="461" stroke="#4f5d75" stroke-width="1.6" marker-end="url(