<svg viewBox="0 0 1280 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eq-conv-window-title eq-conv-window-desc">
        <title id="eq-conv-window-title">One convolution position</title>
        <desc id="eq-conv-window-desc">The rule y = sum over k of w-k x-k, its five symbols, and one position of a 3 by 3 filter worked on a 5 by 5 image. The window holds the values 1 to 9 and the filter is 1, 0, -1 on each of its three rows. Each row of the window gives one product line: 1 times 1 plus 0 times 2 plus -1 times 3 is 1 plus 0 minus 3, which is -2, and each of the next two rows gives -2 again, so y = -2 - 2 - 2 = -6. The same nine weights are reused when the window shifts one cell right; at the border the window runs off the image, so with no padding those positions have no y.</desc>
        <defs>
          <marker id="eq-conv-window-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <text x="120" y="124" font-size="30" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142"><tspan fill="#bf4520">y</tspan> = Σ<tspan font-size="16" dy="5.5">k</tspan><tspan dy="-5.5"> w</tspan><tspan font-size="16" dy="5.5">k</tspan><tspan dy="-5.5"> x</tspan><tspan font-size="16" dy="5.5">k</tspan></text>
