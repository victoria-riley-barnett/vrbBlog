        <text x="380" y="176" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" letter-spacing="0.14em">WHAT IT IS</text>
        <line x1="120" y1="190" x2="1160" y2="190" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <text x="120" y="218" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">y</text>
        <text x="200" y="218" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">output</text>
        <text x="380" y="218" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">number; the value written for this one window position</text>
        <text x="120" y="244" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">Σ<tspan font-size="10" dy="3.5">k</tspan></text>
        <text x="200" y="244" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">sum</text>
        <text x="380" y="244" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">operator; add the nine terms, one per cell of the window</text>
        <text x="120" y="270" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">k</text>
        <text x="200" y="270" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">cell index</text>
        <text x="380" y="270" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">index; 1 to 9, which cell of the window</text>
        <text x="120" y="296" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">w<tspan font-size="10" dy="3.5">k</tspan></text>
        <text x="200" y="296" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">filter weight</text>
        <text x="380" y="296" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">number; the filter weight at cell k, the same nine at every position</text>
        <text x="120" y="322" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">x<tspan font-size="10" dy="3.5">k</tspan></text>
        <text x="200" y="322" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">pixel</text>
        <text x="380" y="322" font-size="12" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">number; the image value at cell k inside this window</text>
        <line x1="120" y1="344" x2="1160" y2="344" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <text x="120" y="378" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" letter-spacing="0.14em">WORKED · IMAGE 5×5 · 1 CHANNEL · WINDOW 3×3 · FILTER 3×3 · STRIDE 1 · NO PADDING</text>
        <text x="120" y="404" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" letter-spacing="0.14em">IMAGE</text>
